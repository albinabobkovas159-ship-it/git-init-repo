<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мини-практика link and images</title>
</head>
<body>
    <h1>Мини-практика link and images</h1>

    <ul>
        <li>Создать обычную ссылку на любой сайт:
            <div><a href="https://www.coupang.com/">Coupang</a></div>
        </li>
        <br>
        <li>Создать ссылку, которая открывается в новой вкладке:
            <div><a href="https://www.11st.co.kr/main" target="_blank">11st</a></div>
        </li>
        <br>
        <li>Вставить картинку с правильным alt:
            <div><img src="./hotel.webp" alt="Luxury hotel booking" width="300"></div>
        </li>
        <br>
        <li>Картинка с кликабельной ссылкой:
            <div><a href="https://www.booking.com/" target="_blank"><img src="./hotel.webp" alt="Luxury hotel booking" width="300"></a></div>
        </li>
    </ul>
    
</body>
</html
